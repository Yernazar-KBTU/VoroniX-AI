# Render Blueprint for VoroniX AI alone (New > Blueprint > pick this repository).
# The full system (CRM + database + this AI) is the blueprint in Yernazar-KBTU/VoroniX.
# VORONIX_AI_KEY is generated by Render; the CRM must send the same key.
# Free plan (https://render.com/docs/free): sleeps after 15 minutes without requests,
# wakes in about a minute.
services:
  - type: web
    name: voronix-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: VORONIX_AI_KEY
        generateValue: true
